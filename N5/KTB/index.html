<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JLPT N5</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    .font-normal {
      font-weight: 400 !important;
    }
    .font-medium {
      font-weight: 500 !important;
    }
    .font-semibold, .font-bold, h1, h2, h3, h4, h5, h6, b, strong {
      font-weight: 600 !important;
    }
    button, [role="button"], a {
      cursor: pointer !important;
    }
  </style>
</head>
<body class="bg-white text-green-950 font-sans antialiased min-h-screen flex flex-col selection:bg-green-950 selection:text-white">
  <header class="sticky top-0 z-40 bg-green-950 text-white shadow-md border-b border-green-900">
    <div class="w-full px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
      <div class="flex items-center space-x-3">
        <button id="btnMobileSidebar" onclick="toggleMobileSidebar()" class="lg:hidden cursor-pointer rounded border border-white/30 p-1.5 hover:bg-white/10 transition">
          <i data-lucide="menu" class="w-5 h-5"></i>
        </button>
        <div class="bg-white text-green-950 p-2 rounded flex items-center justify-center font-semibold text-xl tracking-wider">言葉</div>
        <div>
          <h1 class="text-lg font-semibold tracking-tight">JLPT</h1>
          <p class="text-xs text-green-200">Learn & Quiz</p>
        </div>
      </div>
      <nav class="flex items-center space-x-2">
        <button id="tabLearn" onclick="switchMode('learn')" class="cursor-pointer rounded px-4 py-1.5 text-sm font-semibold transition flex items-center space-x-2 bg-white text-green-950 shadow-sm">
          <i data-lucide="book-open" class="w-4 h-4"></i>
          <span>Learn</span>
        </button>
        <button id="tabQuiz" onclick="switchMode('quiz')" class="cursor-pointer rounded px-4 py-1.5 text-sm font-semibold transition flex items-center space-x-2 text-green-100 hover:text-white hover:bg-green-800">
          <i data-lucide="brain-circuit" class="w-4 h-4"></i>
          <span>Quiz</span>
        </button>
      </nav>
    </div>
  </header>
  <div class="flex-1 w-full flex overflow-hidden">
    <aside class="w-64 bg-white border-r border-green-950/10 p-4 shrink-0 hidden lg:flex flex-col space-y-4 overflow-y-auto">
      <div class="flex items-center justify-between border-b border-green-950/10 pb-3">
        <h2 class="text-base font-semibold text-green-950 flex items-center space-x-2">
          <i data-lucide="layers" class="w-4 h-4"></i>
          <span>Lessons</span>
        </h2>
        <span id="lessonSidebarTotalCount" class="text-xs font-semibold text-green-950/60">25 Lessons</span>
      </div>
      <div id="lessonSidebarContainer" class="space-y-1.5 flex-1 overflow-y-auto pr-1"></div>
    </aside>
    <div id="mobileSidebarModal" class="hidden fixed inset-0 z-50 bg-black/50 lg:hidden flex">
      <div class="bg-white w-72 h-full p-4 flex flex-col space-y-4 shadow-xl overflow-y-auto">
        <div class="flex items-center justify-between border-b border-green-950/10 pb-3">
          <h2 class="text-base font-semibold text-green-950 flex items-center space-x-2">
            <i data-lucide="layers" class="w-4 h-4"></i>
            <span>Lessons</span>
          </h2>
          <button onclick="toggleMobileSidebar()" class="cursor-pointer rounded p-1 text-green-950 hover:bg-green-950/10">
            <i data-lucide="x" class="w-5 h-5"></i>
          </button>
        </div>
        <div id="mobileLessonSidebarContainer" class="space-y-1.5 flex-1 overflow-y-auto pr-1"></div>
      </div>
    </div>
    <main class="flex-1 w-full p-4 sm:p-6 lg:p-8 overflow-y-auto">
      <section id="modeLearn" class="space-y-6">
        <div class="bg-white border border-green-950/20 p-4 rounded shadow-sm flex flex-wrap items-center justify-between gap-3">
          <div class="flex flex-wrap items-center gap-3 w-full md:w-auto flex-1">
            <div class="relative w-full md:w-80">
              <i data-lucide="search" class="w-4 h-4 absolute left-3 top-1/2 -translate-y-1/2 text-green-950/60"></i>
              <input type="text" id="learnSearch" oninput="handleSearch()" placeholder="Search" class="w-full pl-9 pr-4 py-2 text-sm border border-green-950/30 rounded focus:outline-none focus:ring-1 focus:ring-green-950 focus:border-green-950">
            </div>
            <select id="typeFilterSelect" onchange="handleTypeFilterChange()" class="border border-green-950/30 rounded px-3 py-2 text-sm bg-white focus:outline-none focus:ring-1 focus:ring-green-950 text-green-950 cursor-pointer font-medium">
              <option value="all">All</option>
            </select>
          </div>
          <div class="flex items-center space-x-3">
            <span id="activeLessonTitleBadge" class="text-xs font-semibold bg-green-950 text-white px-3 py-1.5 rounded">All Lessons</span>
            <span id="learnCountText" class="text-xs text-green-950/70 font-semibold">Showing 0 Items</span>
          </div>
        </div>
        <div id="kotobaGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6 items-start"></div>
        <div id="paginationContainer"></div>
      </section>
      <section id="modeQuiz" class="hidden space-y-6 max-w-4xl mx-auto">
      <div class="bg-white border border-green-950/20 p-4 rounded shadow-sm flex flex-nowrap items-center justify-between gap-3 overflow-x-auto">
        <div class="flex items-center space-x-2 shrink-0">
          <div class="flex items-center space-x-1 text-xs font-semibold bg-green-950 text-white px-2.5 py-1.5 rounded">
            <i data-lucide="check" class="w-3.5 h-3.5"></i>
            <strong id="quizCorrectCount" class="font-semibold">0</strong>
          </div>
          <div class="flex items-center space-x-1 text-xs font-semibold bg-green-900 text-white px-2.5 py-1.5 rounded">
            <i data-lucide="x" class="w-3.5 h-3.5"></i>
            <strong id="quizIncorrectCount" class="font-semibold">0</strong>
          </div>
          <div class="flex items-center space-x-1 text-xs font-semibold bg-green-950/10 px-2.5 py-1.5 rounded text-green-950">
            <span>Remaining: <strong id="quizWordsLeftCount" class="font-semibold">0</strong></span>
          </div>
          <div class="flex items-center space-x-1 text-xs font-semibold bg-green-950/10 px-2.5 py-1.5 rounded text-green-950">
            <span>All: <strong id="quizTotalWordsCount" class="font-semibold">0</strong></span>
          </div>
        </div>
        <div class="flex items-center space-x-2 shrink-0">
          <button id="btnQuizIncorrect" onclick="toggleQuizIncorrectOnly()" class="cursor-pointer rounded border border-green-950 px-3 py-1.5 text-xs font-semibold hover:bg-green-950 hover:text-white transition flex items-center space-x-1">
            <i data-lucide="brain" class="w-3.5 h-3.5"></i>
            <span>Redemption</span>
          </button>
          <button id="btnIncorrectList" onclick="openIncorrectModal()" class="cursor-pointer rounded border border-green-950 px-3 py-1.5 text-xs font-semibold hover:bg-green-950 hover:text-white transition flex items-center space-x-1">
            <i data-lucide="list-x" class="w-3.5 h-3.5"></i>
            <span>Failures</span>
          </button>
          <button onclick="newQuizQuestion()" class="cursor-pointer rounded border border-green-950 px-3 py-1.5 text-xs font-semibold hover:bg-green-950 hover:text-white transition flex items-center space-x-1">
            <i data-lucide="refresh-cw" class="w-3.5 h-3.5"></i>
            <span>Reroll</span>
          </button>
          <button id="btnClockPause" onclick="toggleClockPause()" class="cursor-pointer rounded border border-green-950 px-3 py-1.5 text-xs font-semibold hover:bg-green-950 hover:text-white transition flex items-center space-x-1">
            <span id="clockPauseIcon"><i data-lucide="pause" class="w-3.5 h-3.5"></i></span>
            <span id="clockPauseText">Pause</span>
          </button>
        </div>
      </div>
        <div id="quizActiveContainer" class="space-y-6">
          <div class="bg-white border-2 border-green-950 p-6 rounded shadow-sm text-center py-8">
            <h2 id="quizQuestionWord" class="text-6xl sm:text-7xl font-normal tracking-wide text-green-950 font-sans">---</h2>
          </div>
          <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <div id="quizReadingBox" class="bg-white border border-green-950/20 p-5 rounded shadow-sm space-y-3">
              <div class="border-b border-green-950/10 pb-2 space-y-1.5">
                <div class="flex items-center justify-between">
                  <h3 class="text-sm font-semibold text-green-950">Reading</h3>
                  <span class="flex items-center space-x-1 text-xs font-semibold text-green-950"><i data-lucide="timer" class="w-3.5 h-3.5"></i><span id="readingTimerText">6.0s</span></span>
                </div>
                <div class="w-full bg-gray-100 h-1 rounded-full overflow-hidden">
                  <div id="readingTimerBar" class="h-full bg-green-950 w-full transition-all duration-75"></div>
                </div>
              </div>
              <div id="quizReadingOptions" class="grid grid-cols-1 gap-2.5"></div>
            </div>
            <div id="quizMeaningBox" class="bg-white border border-green-950/20 p-5 rounded shadow-sm space-y-3 hidden">
              <div class="border-b border-green-950/10 pb-2 space-y-1.5">
                <div class="flex items-center justify-between">
                  <h3 class="text-sm font-semibold text-green-950">Meaning</h3>
                  <span class="flex items-center space-x-1 text-xs font-semibold text-green-950"><i data-lucide="timer" class="w-3.5 h-3.5"></i><span id="meaningTimerText">6.0s</span></span>
                </div>
                <div class="w-full bg-gray-100 h-1 rounded-full overflow-hidden">
                  <div id="meaningTimerBar" class="h-full bg-green-950 w-full transition-all duration-75"></div>
                </div>
              </div>
              <div id="quizMeaningOptions" class="grid grid-cols-1 gap-2.5"></div>
            </div>
          </div>
          <div class="flex flex-col items-center justify-center space-y-3 pt-2">
            <button id="btnNext" onclick="handleQuizSubmit()" class="cursor-pointer rounded bg-green-950 text-white px-8 py-3.5 text-base font-semibold hover:bg-green-900 focus:outline-none transition flex items-center justify-center space-x-2 w-full sm:w-64 shadow-md">
              <span>OK</span>
              <i data-lucide="arrow-right" class="w-5 h-5"></i>
            </button>
            <div id="quizFeedbackMsg" class="hidden text-sm font-semibold text-center px-4 py-2 rounded w-full sm:w-96 border"></div>
          </div>
        </div>
        <div id="quizCompletedContainer" class="hidden bg-white border-2 border-green-950 p-8 rounded shadow-sm text-center max-w-xl mx-auto space-y-6">
          <h2 class="text-3xl font-semibold text-green-950 flex items-center justify-center space-x-2">
            <i data-lucide="check-circle-2" class="w-8 h-8 text-green-950"></i>
            <span>Done!</span>
          </h2>
          <p id="quizCompletedMsg" class="text-base text-green-950/80 font-normal">You Have Completed All Words In This Lesson!</p>
          <div class="grid grid-cols-2 gap-3 py-2">
            <div class="bg-green-950 text-white p-3 rounded">
              <span class="text-xs text-green-200 block font-semibold">Correct</span>
              <span id="quizDoneCorrect" class="text-xl font-semibold text-white">0</span>
            </div>
            <div class="bg-green-900 text-white p-3 rounded">
              <span class="text-xs text-green-200 block font-semibold">Incorrect</span>
              <span id="quizDoneIncorrect" class="text-xl font-semibold text-white">0</span>
            </div>
          </div>
          <div class="flex justify-center pt-2">
            <button id="btnRestartQuiz" onclick="restartQuiz()" class="cursor-pointer rounded bg-green-950 text-white px-8 py-3.5 text-base font-semibold hover:bg-green-900 transition flex items-center space-x-2 shadow-md">
              <i data-lucide="rotate-ccw" class="w-5 h-5"></i>
              <span>OK</span>
            </button>
          </div>
        </div>
      </section>
    </main>
  </div>
  <div id="incorrectModal" class="hidden fixed inset-0 z-50 bg-black/50 flex items-center justify-center p-4">
    <div
      class="bg-white border-2 border-green-950 rounded p-6 max-w-lg w-full max-h-[80vh] flex flex-col space-y-4 shadow-xl">
      <div class="flex items-center justify-between border-b border-green-950/10 pb-2">
        <h3 class="text-base font-semibold text-green-950 flex items-center space-x-2">
          <i data-lucide="alert-circle" class="w-4 h-4"></i>
          <span>Incorrect Words List</span>
        </h3>
        <div class="flex items-center space-x-2">
          <button onclick="downloadWrongFile()"
            class="cursor-pointer rounded border border-green-950 px-2.5 py-1 text-xs font-semibold hover:bg-green-950 hover:text-white transition flex items-center space-x-1">
            <i data-lucide="download" class="w-3.5 h-3.5"></i>
            <span>Download</span>
          </button>
          <button onclick="closeIncorrectModal()"
            class="cursor-pointer rounded p-1 text-green-950 hover:bg-green-950/10">
            <i data-lucide="x" class="w-5 h-5"></i>
          </button>
        </div>
      </div>
      <div id="incorrectListContainer" class="flex-1 overflow-y-auto space-y-2 pr-1"></div>
    </div>
  </div>
  <footer class="bg-green-950 text-white py-4 border-t border-green-900 mt-auto">
    <div class="w-full text-center text-xs text-green-200">JLPT</div>
  </footer>
  <script>

    function toggleClockPause() {
      isTimerPaused = !isTimerPaused;
      updatePauseBtnUI();
      if (isTimerPaused) {
        if (quizTimer) {
          clearInterval(quizTimer);
          quizTimer = null;
        }
      } else {
        if (timerStep && !isQuizAnswered && stepTimeRemaining > 0) {
          resumeStepTimer();
        }
      }
    }
    function updatePauseBtnUI() {
      const icon = document.getElementById('clockPauseIcon');
      const text = document.getElementById('clockPauseText');
      if (!icon || !text) return;
      if (isTimerPaused) {
        icon.innerHTML = '<i data-lucide="play" class="w-3.5 h-3.5"></i>';
        text.innerText = 'Resume';
      } else {
        icon.innerHTML = '<i data-lucide="pause" class="w-3.5 h-3.5"></i>';
        text.innerText = 'Pause';
      }
      if (window.lucide) lucide.createIcons();
    }
    function clearQuizTimer() {
      if (quizTimer) {
        clearInterval(quizTimer);
        quizTimer = null;
      }
      timerStep = null;
    }
    function resumeStepTimer() {
      if (quizTimer) {
        clearInterval(quizTimer);
        quizTimer = null;
      }
      const targetEndTime = Date.now() + stepTimeRemaining;
      quizTimer = setInterval(() => {
        const now = Date.now();
        stepTimeRemaining = Math.max(0, targetEndTime - now);
        updateTimerUI();
        if (stepTimeRemaining <= 0) {
          const step = timerStep;
          clearQuizTimer();
          handleQuizTimeout(step);
        }
      }, 50);
    }
    function startStepTimer(step) {
      if (quizTimer) {
        clearInterval(quizTimer);
        quizTimer = null;
      }
      timerStep = step;
      stepTimeRemaining = timerLimit;
      updateTimerUI();
      if (isTimerPaused) return;
      resumeStepTimer();
    }
    function updateTimerUI() {
      const secondsStr = (stepTimeRemaining / 1000).toFixed(1) + 's';
      const progressPct = (stepTimeRemaining / timerLimit) * 100;
      if (timerStep === 'reading') {
        const el = document.getElementById('readingTimerText');
        if (el) el.innerText = secondsStr;
        const bar = document.getElementById('readingTimerBar');
        if (bar) bar.style.width = progressPct + '%';
      } else if (timerStep === 'meaning') {
        const el = document.getElementById('meaningTimerText');
        if (el) el.innerText = secondsStr;
        const bar = document.getElementById('meaningTimerBar');
        if (bar) bar.style.width = progressPct + '%';
      }
    }
    function handleQuizTimeout(step) {
      if (isQuizAnswered || !currentQuizQuestion) return;
      isQuizAnswered = true;
      quizAnsweredCount++;
      const feedback = document.getElementById('quizFeedbackMsg');
      feedback.innerText = 'Incorrect';
      feedback.className = 'text-sm font-semibold text-center px-4 py-2 rounded w-full sm:w-96 border border-red-600 bg-white text-red-500 block';
      const targetWord = currentQuizQuestion.target.japanese;
      if (isQuizIncorrectOnly) {
        if (currentQuizQuestion.target) {
          remainingVocabPool.push(currentQuizQuestion.target);
        }
      } else {
        quizIncorrectCount++;
        if (!incorrectWordsList.some(item => (item.japanese || item.word) === targetWord)) {
          incorrectWordsList.push({
            japanese: currentQuizQuestion.target.japanese,
            reading: currentQuizQuestion.target.reading || '',
            meaning: currentQuizQuestion.target.meaning || '',
            type: currentQuizQuestion.target.type || ''
          });
          saveIncorrectToStorage();
        }
      }
      updateQuizHeaderStats();
      renderQuizOptions();
      setTimeout(() => {
        newQuizQuestion();
      }, 1000);
    }

      try {
        const data = localStorage.getItem('incorrect');
        if (data) incorrectWordsList = JSON.parse(data);
      } catch (e) { }
    }
    function saveIncorrectToStorage() {
      try {
        localStorage.setItem('incorrect', JSON.stringify(incorrectWordsList));
      } catch (e) { }
    }
    function toggleMobileSidebar() {
      const modal = document.getElementById('mobileSidebarModal');
      modal.classList.toggle('hidden');
    }
    function renderSidebar() {
      const deskContainer = document.getElementById('lessonSidebarContainer');
      const mobContainer = document.getElementById('mobileLessonSidebarContainer');
      let html = '';
      const totalAllItems = Object.values(kotobaLessons).reduce((acc, curr) => acc + curr.length, 0);
      const allActiveCls = selectedLesson === 0 ? 'bg-green-950 text-white font-semibold shadow-sm' : 'border border-green-950/20 text-green-950 hover:bg-green-950/5 font-medium';
      html += '<button onclick="selectLesson(0)" class="w-full text-left px-3 py-2 text-xs rounded transition flex items-center justify-between cursor-pointer ' + allActiveCls + '"><span>All Lessons</span><span class="opacity-80">' + totalAllItems + '</span></button>';
      for (let i = 1; i <= 25; i++) {
        const count = kotobaLessons[i] ? kotobaLessons[i].length : 0;
        const activeCls = selectedLesson === i ? 'bg-green-950 text-white font-semibold shadow-sm' : 'border border-green-950/20 text-green-950 hover:bg-green-950/5 font-medium';
        html += '<button onclick="selectLesson(' + i + ')" class="w-full text-left px-3 py-2 text-xs rounded transition flex items-center justify-between cursor-pointer ' + activeCls + '"><span>Lesson ' + i + '</span><span class="opacity-80">' + count + '</span></button>';
      }
      deskContainer.innerHTML = html;
      mobContainer.innerHTML = html;
      document.getElementById('lessonSidebarTotalCount').innerText = '25 Lessons';
    }
    function updateTypeFilterOptions() {
      const select = document.getElementById('typeFilterSelect');
      if (!select) return;
      const typeSet = new Set();
      activePool.forEach(item => {
        if (item.type && item.type.trim()) {
          typeSet.add(item.type.trim());
        }
      });
      const types = Array.from(typeSet).sort();
      let html = '<option value="all">All Types</option>';
      types.forEach(t => {
        const selectedAttr = selectedTypeFilter.toLowerCase() === t.toLowerCase() ? ' selected' : '';
        const capLabel = t.charAt(0).toUpperCase() + t.slice(1);
        html += '<option value="' + t + '"' + selectedAttr + '>' + capLabel + '</option>';
      });
      select.innerHTML = html;
    }
    function handleTypeFilterChange() {
      const select = document.getElementById('typeFilterSelect');
      if (select) selectedTypeFilter = select.value;
      currentPage = 1;
      renderLearnMode();
    }
    function selectLesson(lessonNum) {
      selectedLesson = lessonNum;
      renderSidebar();
      const badge = document.getElementById('activeLessonTitleBadge');
      if (lessonNum === 0) {
        badge.innerText = 'All Lessons';
      } else {
        badge.innerText = 'Lesson ' + lessonNum;
      }
      activePool = [];
      if (lessonNum === 0) {
        for (let i = 1; i <= 25; i++) {
          if (kotobaLessons[i]) {
            kotobaLessons[i].forEach(item => {
              activePool.push({ ...item, lesson: i });
            });
          }
        }
      } else if (kotobaLessons[lessonNum]) {
        kotobaLessons[lessonNum].forEach(item => {
          activePool.push({ ...item, lesson: lessonNum });
        });
      }
      updateTypeFilterOptions();
      savedMainQuizState = null;
      quizAnsweredCount = 0;
      quizCorrectCount = 0;
      remainingVocabPool = [...activePool];
      currentPage = 1;
      renderLearnMode();
      if (document.getElementById('modeQuiz').classList.contains('hidden') === false) {
        newQuizQuestion();
      }
      const mobModal = document.getElementById('mobileSidebarModal');
      if (!mobModal.classList.contains('hidden')) {
        mobModal.classList.add('hidden');
      }
    }
    function switchMode(mode) {
      const tabLearn = document.getElementById('tabLearn');
      const tabQuiz = document.getElementById('tabQuiz');
      const modeLearn = document.getElementById('modeLearn');
      const modeQuiz = document.getElementById('modeQuiz');
      if (mode === 'learn') {
        clearQuizTimer();
        tabLearn.className = "cursor-pointer rounded px-4 py-1.5 text-sm font-semibold transition flex items-center space-x-2 bg-white text-green-950 shadow-sm";
        tabQuiz.className = "cursor-pointer rounded px-4 py-1.5 text-sm font-semibold transition flex items-center space-x-2 text-green-100 hover:text-white hover:bg-green-800";
        modeLearn.classList.remove('hidden');
        modeQuiz.classList.add('hidden');
      } else {
        tabQuiz.className = "cursor-pointer rounded px-4 py-1.5 text-sm font-semibold transition flex items-center space-x-2 bg-white text-green-950 shadow-sm";
        tabLearn.className = "cursor-pointer rounded px-4 py-1.5 text-sm font-semibold transition flex items-center space-x-2 text-green-100 hover:text-white hover:bg-green-800";
        modeQuiz.classList.remove('hidden');
        modeLearn.classList.add('hidden');
        if (!currentQuizQuestion) { newQuizQuestion(); }
      }
      lucide.createIcons();
    }
    function handleSearch() {
      searchQuery = document.getElementById('learnSearch').value.trim().toLowerCase();
      currentPage = 1;
      renderLearnMode();
    }
    function changePage(page) {
      currentPage = page;
      renderLearnMode();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }
    function renderLearnMode() {
      const gridContainer = document.getElementById('kotobaGrid');
      const paginationContainer = document.getElementById('paginationContainer');
      const filtered = activePool.filter(item => {
        const matchesSearch = !searchQuery ||
          (item.japanese && item.japanese.toLowerCase().includes(searchQuery)) ||
          (item.reading && item.reading.toLowerCase().includes(searchQuery)) ||
          (item.meaning && item.meaning.toLowerCase().includes(searchQuery));
        const matchesType = selectedTypeFilter === 'all' || (item.type && item.type.toLowerCase() === selectedTypeFilter.toLowerCase());
        return matchesSearch && matchesType;
      });
      const totalPages = Math.max(1, Math.ceil(filtered.length / itemsPerPage));
      if (currentPage > totalPages) currentPage = totalPages;
      if (currentPage < 1) currentPage = 1;
      document.getElementById('learnCountText').innerText = 'Showing ' + filtered.length + ' Items';
      const startIndex = (currentPage - 1) * itemsPerPage;
      const pageData = filtered.slice(startIndex, startIndex + itemsPerPage);
      if (pageData.length === 0) {
        gridContainer.innerHTML = '<div class="col-span-full py-12 text-center text-green-950/60 border border-dashed border-green-950/20 rounded"><p class="text-sm font-semibold">No Matching Words Found</p></div>';
        paginationContainer.innerHTML = '';
        return;
      }
      gridContainer.innerHTML = pageData.map(item => {
        const readingHtml = item.reading ? '<div class="text-lg sm:text-xl font-normal text-green-900">読み: ' + item.reading + '</div>' : '';
        const lessonTagHtml = selectedLesson === 0 ? '<span class="text-xs text-green-950/50 font-semibold">Lesson ' + item.lesson + '</span>' : '';
        return '<div class="bg-white border border-green-950/30 rounded p-5 shadow-sm hover:border-green-950 transition flex flex-col space-y-3">' +
          '<div class="border-b border-green-950/10 pb-3">' +
          '<h3 class="text-3xl sm:text-4xl font-normal text-green-950 font-sans tracking-tight">' + item.japanese + '</h3>' +
          '</div>' +
          '<div class="space-y-1.5 flex-1">' +
          readingHtml +
          '<div class="text-base sm:text-lg text-green-950/90 font-normal">意味: ' + item.meaning + '</div>' +
          '</div>' +
          (lessonTagHtml ? '<div class="pt-2 border-t border-green-950/10 text-right">' + lessonTagHtml + '</div>' : '') +
          '</div>';
      }).join('');
      if (totalPages > 1) {
        let navHtml = '<div class="mt-12 flex justify-center items-center gap-2">';
        navHtml += '<button onclick="changePage(1)" ' + (currentPage === 1 ? 'disabled' : '') + ' class="px-3 py-2 border border-green-950 text-green-950 hover:bg-green-950 hover:text-white transition-colors disabled:opacity-50 disabled:cursor-not-allowed cursor-pointer rounded" aria-label="First Page"><i data-lucide="chevrons-left" class="w-4 h-4"></i></button>';
        navHtml += '<button onclick="changePage(' + (currentPage - 1) + ')" ' + (currentPage === 1 ? 'disabled' : '') + ' class="px-3 py-2 border border-green-950 text-green-950 hover:bg-green-950 hover:text-white transition-colors disabled:opacity-50 disabled:cursor-not-allowed cursor-pointer rounded" aria-label="Previous Page"><i data-lucide="chevron-left" class="w-4 h-4"></i></button>';
        let startP = Math.max(1, currentPage - 1);
        let endP = Math.min(totalPages, currentPage + 1);
        if (currentPage === 1) endP = Math.min(totalPages, 3);
        if (currentPage === totalPages) startP = Math.max(1, totalPages - 2);
        for (let p = startP; p <= endP; p++) {
          if (p === currentPage) {
            navHtml += '<button class="px-4 py-2 font-medium transition-colors border bg-green-950 text-white border-green-950 cursor-pointer rounded">' + p + '</button>';
          } else {
            navHtml += '<button onclick="changePage(' + p + ')" class="px-4 py-2 font-medium transition-colors border bg-white text-green-950 border-green-950 hover:bg-green-950 hover:text-white cursor-pointer rounded">' + p + '</button>';
          }
        }
        navHtml += '<button onclick="changePage(' + (currentPage + 1) + ')" ' + (currentPage === totalPages ? 'disabled' : '') + ' class="px-3 py-2 border border-green-950 text-green-950 hover:bg-green-950 hover:text-white transition-colors disabled:opacity-50 disabled:cursor-not-allowed cursor-pointer rounded" aria-label="Next Page"><i data-lucide="chevron-right" class="w-4 h-4"></i></button>';
        navHtml += '<button onclick="changePage(' + totalPages + ')" ' + (currentPage === totalPages ? 'disabled' : '') + ' class="px-3 py-2 border border-green-950 text-green-950 hover:bg-green-950 hover:text-white transition-colors disabled:opacity-50 disabled:cursor-not-allowed cursor-pointer rounded" aria-label="Last Page"><i data-lucide="chevrons-right" class="w-4 h-4"></i></button>';
        navHtml += '</div>';
        paginationContainer.innerHTML = navHtml;
      } else {
        paginationContainer.innerHTML = '';
      }
      lucide.createIcons();
    }
    function getSmartDistractorOptions(targetItem) {
      const candidates = activePool.filter(v => v.japanese !== targetItem.japanese);
      const scored = candidates.map(cand => {
        let score = 0;
        if (cand.type && targetItem.type && cand.type === targetItem.type) score += 50;
        if (cand.japanese.length === targetItem.japanese.length) score += 30;
        const candReading = cand.reading || cand.japanese;
        const targetReading = targetItem.reading || targetItem.japanese;
        if (Math.abs(candReading.length - targetReading.length) <= 1) score += 15;
        if (candReading === targetReading) score -= 100;
        if (cand.meaning === targetItem.meaning) score -= 100;
        score += Math.random() * 10;
        return { cand, score };
      });
      scored.sort((a, b) => b.score - a.score);
      const readingDistractors = [];
      const usedReadings = new Set([targetItem.reading || targetItem.japanese]);
      for (let item of scored) {
        const text = item.cand.reading || item.cand.japanese;
        if (!usedReadings.has(text)) {
          usedReadings.add(text);
          readingDistractors.push(text);
          if (readingDistractors.length === 3) break;
        }
      }
      const meaningDistractors = [];
      const usedMeanings = new Set([targetItem.meaning]);
      for (let item of scored) {
        if (!usedMeanings.has(item.cand.meaning)) {
          usedMeanings.add(item.cand.meaning);
          meaningDistractors.push(item.cand.meaning);
          if (meaningDistractors.length === 3) break;
        }
      }
      const targetReadingText = targetItem.reading || targetItem.japanese;
      return {
        readingChoices: shuffleArray([{ text: targetReadingText, isCorrect: true }, ...readingDistractors.map(r => ({ text: r, isCorrect: false }))]),
        meaningChoices: shuffleArray([{ text: targetItem.meaning, isCorrect: true }, ...meaningDistractors.map(m => ({ text: m, isCorrect: false }))])
      };
    }
    function shuffleArray(arr) {
      const a = [...arr];
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }
    function toggleQuizIncorrectOnly() {
      if (!isQuizIncorrectOnly && incorrectWordsList.length === 0) {
        alert('No Incorrect Words Saved!');
        return;
      }
      isQuizIncorrectOnly = !isQuizIncorrectOnly;
      const btn = document.getElementById('btnQuizIncorrect');
      if (isQuizIncorrectOnly) {
        btn.className = "cursor-pointer rounded border border-green-950 bg-green-950 text-white px-3 py-1.5 text-xs font-semibold transition flex items-center space-x-1 shadow-sm";
        if (currentQuizQuestion && !isQuizAnswered && currentQuizQuestion.target) {
          remainingVocabPool.unshift(currentQuizQuestion.target);
        }
        savedMainQuizState = {
          remainingVocabPool: [...remainingVocabPool]
        };
        remainingVocabPool = [...incorrectWordsList];
      } else {
        btn.className = "cursor-pointer rounded border border-green-950 px-3 py-1.5 text-xs font-semibold hover:bg-green-950 hover:text-white transition flex items-center space-x-1";
        if (savedMainQuizState) {
          remainingVocabPool = [...savedMainQuizState.remainingVocabPool];
          savedMainQuizState = null;
        } else {
          remainingVocabPool = [...activePool];
        }
      }
      newQuizQuestion();
    }
    function showQuizCompletedScreen() {
      clearQuizTimer();
      const activeBox = document.getElementById('quizActiveContainer');
      const doneBox = document.getElementById('quizCompletedContainer');
      const sourcePool = isQuizIncorrectOnly ? incorrectWordsList : activePool;
      const lessonTitle = selectedLesson === 0 ? 'All Lessons' : 'Lesson ' + selectedLesson;
      document.getElementById('quizCompletedMsg').innerText = 'You Have Completed All ' + sourcePool.length + ' Words In ' + lessonTitle + '!';
      const ansDoneEl = document.getElementById('quizDoneAnswered');
      if (ansDoneEl) ansDoneEl.innerText = quizAnsweredCount;
      document.getElementById('quizDoneCorrect').innerText = quizCorrectCount;
      document.getElementById('quizDoneIncorrect').innerText = Math.max(0, quizAnsweredCount - quizCorrectCount);
      activeBox.classList.add('hidden');
      doneBox.classList.remove('hidden');
      updateQuizHeaderStats();
      lucide.createIcons();
    }
    function restartQuiz() {
      savedMainQuizState = null;
      const sourcePool = isQuizIncorrectOnly ? incorrectWordsList : activePool;
      remainingVocabPool = [...sourcePool];
      quizAnsweredCount = 0;
      quizCorrectCount = 0;
      quizIncorrectCount = 0;
      document.getElementById('quizCompletedContainer').classList.add('hidden');
      document.getElementById('quizActiveContainer').classList.remove('hidden');
      newQuizQuestion();
    }
    function newQuizQuestion() {
      clearQuizTimer();
      if (isQuizIncorrectOnly && (incorrectWordsList.length === 0 || remainingVocabPool.length === 0)) {
        isQuizIncorrectOnly = false;
        const btn = document.getElementById('btnQuizIncorrect');
        if (btn) btn.className = "cursor-pointer rounded border border-green-950 px-3 py-1.5 text-xs font-semibold hover:bg-green-950 hover:text-white transition flex items-center space-x-1";
        if (savedMainQuizState) {
          remainingVocabPool = [...savedMainQuizState.remainingVocabPool];
          savedMainQuizState = null;
        } else {
          remainingVocabPool = [...activePool];
        }
      }
      const sourcePool = isQuizIncorrectOnly ? incorrectWordsList : activePool;
      if (sourcePool.length === 0) return;
      if (remainingVocabPool.length === 0) {
        showQuizCompletedScreen();
        return;
      }
      document.getElementById('quizCompletedContainer').classList.add('hidden');
      document.getElementById('quizActiveContainer').classList.remove('hidden');
      const randIdx = Math.floor(Math.random() * remainingVocabPool.length);
      const target = remainingVocabPool.splice(randIdx, 1)[0];
      const { readingChoices, meaningChoices } = getSmartDistractorOptions(target);
      currentQuizQuestion = { target, readingChoices, meaningChoices };
      selectedReadingIdx = null;
      selectedMeaningIdx = null;
      isQuizAnswered = false;
      document.getElementById('quizQuestionWord').innerText = target.japanese;
      document.getElementById('quizFeedbackMsg').className = 'hidden text-sm font-semibold text-center px-4 py-2 rounded w-full sm:w-96 border';
      const rEl = document.getElementById('readingTimerText');
      if (rEl) rEl.innerText = '6.0s';
      const mEl = document.getElementById('meaningTimerText');
      if (mEl) mEl.innerText = '6.0s';
      updateQuizHeaderStats();
      renderQuizOptions();
      startStepTimer('reading');
      lucide.createIcons();
    }
    function updateQuizHeaderStats() {
      const sourcePool = isQuizIncorrectOnly ? incorrectWordsList : activePool;
      const ansEl = document.getElementById('quizAnsweredCount');
      if (ansEl) ansEl.innerText = quizAnsweredCount;
      document.getElementById('quizCorrectCount').innerText = quizCorrectCount;
      document.getElementById('quizIncorrectCount').innerText = quizIncorrectCount;
      const remainingCount = remainingVocabPool.length + (currentQuizQuestion && !isQuizAnswered ? 1 : 0);
      document.getElementById('quizWordsLeftCount').innerText = remainingCount;
      document.getElementById('quizTotalWordsCount').innerText = sourcePool.length;
    }
    function renderQuizOptions() {
      if (!currentQuizQuestion) return;
      const meaningBoxContainer = document.getElementById('quizMeaningBox');
      if (meaningBoxContainer) {
        if (selectedReadingIdx === null && !isQuizAnswered) {
          meaningBoxContainer.classList.add('hidden');
        } else {
          meaningBoxContainer.classList.remove('hidden');
        }
      }
      const readingBox = document.getElementById('quizReadingOptions');
      const meaningBox = document.getElementById('quizMeaningOptions');
      readingBox.innerHTML = currentQuizQuestion.readingChoices.map((opt, idx) => {
        let btnStyle = 'border-green-950/30 text-green-950 hover:bg-green-950/5';
        if (selectedReadingIdx === idx) { btnStyle = 'border-green-950 bg-green-950 text-white shadow-sm'; }
        if (isQuizAnswered) {
          if (opt.isCorrect) { btnStyle = 'border-green-950 bg-green-950 text-white font-semibold'; }
          else if (selectedReadingIdx === idx && !opt.isCorrect) { btnStyle = 'border-red-600 bg-white text-red-500 font-semibold'; }
          else { btnStyle = 'border-gray-200 text-gray-400 opacity-60'; }
        }
        return '<button onclick="selectReading(' + idx + ')" ' + (isQuizAnswered ? 'disabled' : '') + ' class="cursor-pointer rounded border p-3 text-left font-semibold text-sm transition flex items-center justify-between ' + btnStyle + '"><span>' + opt.text + '</span>' + (selectedReadingIdx === idx ? '<i data-lucide="check-circle" class="w-4 h-4"></i>' : '') + '</button>';
      }).join('');
      meaningBox.innerHTML = currentQuizQuestion.meaningChoices.map((opt, idx) => {
        let btnStyle = 'border-green-950/30 text-green-950 hover:bg-green-950/5';
        if (selectedMeaningIdx === idx) { btnStyle = 'border-green-950 bg-green-950 text-white shadow-sm'; }
        if (isQuizAnswered) {
          if (opt.isCorrect) { btnStyle = 'border-green-950 bg-green-950 text-white font-semibold'; }
          else if (selectedMeaningIdx === idx && !opt.isCorrect) { btnStyle = 'border-red-600 bg-white text-red-500 font-semibold'; }
          else { btnStyle = 'border-gray-200 text-gray-400 opacity-60'; }
        }
        return '<button onclick="selectMeaning(' + idx + ')" ' + (isQuizAnswered ? 'disabled' : '') + ' class="cursor-pointer rounded border p-3 text-left font-semibold text-sm transition flex items-center justify-between ' + btnStyle + '"><span>' + opt.text + '</span>' + (selectedMeaningIdx === idx ? '<i data-lucide="check-circle" class="w-4 h-4"></i>' : '') + '</button>';
      }).join('');
      lucide.createIcons();
    }
    function selectReading(idx) {
      if (isQuizAnswered) return;
      selectedReadingIdx = idx;
      renderQuizOptions();
      if (timerStep !== 'meaning') {
        startStepTimer('meaning');
      }
    }
    function selectMeaning(idx) {
      if (isQuizAnswered) return;
      selectedMeaningIdx = idx;
      clearQuizTimer();
      renderQuizOptions();
      handleQuizSubmit();
    }
    function handleQuizSubmit() {
      clearQuizTimer();
      if (!currentQuizQuestion || isQuizAnswered) return;
      const feedback = document.getElementById('quizFeedbackMsg');
      if (selectedReadingIdx === null || selectedMeaningIdx === null) {
        feedback.innerText = 'Select 1 Reading & 1 Meaning';
        feedback.className = 'text-sm font-semibold text-center px-4 py-2 rounded w-full sm:w-96 border border-green-950 bg-green-950/10 text-green-950 block';
        return;
      }
      isQuizAnswered = true;
      quizAnsweredCount++;
      const isReadingCorrect = currentQuizQuestion.readingChoices[selectedReadingIdx].isCorrect;
      const isMeaningCorrect = currentQuizQuestion.meaningChoices[selectedMeaningIdx].isCorrect;
      const isBothCorrect = isReadingCorrect && isMeaningCorrect;
      if (isBothCorrect) {
        quizCorrectCount++;
        if (isQuizIncorrectOnly) {
          quizIncorrectCount = Math.max(0, quizIncorrectCount - 1);
        }
        feedback.innerText = 'Correct';
        feedback.className = 'text-sm font-semibold text-center px-4 py-2 rounded w-full sm:w-96 border border-green-950 bg-green-950 text-white block';
        const targetWord = currentQuizQuestion.target.japanese;
        const existingIdx = incorrectWordsList.findIndex(item => (item.japanese || item.word) === targetWord);
        if (existingIdx !== -1) {
          incorrectWordsList.splice(existingIdx, 1);
          saveIncorrectToStorage();
        }
        const remIdx = remainingVocabPool.findIndex(item => (item.japanese || item.word) === targetWord);
        if (remIdx !== -1) {
          remainingVocabPool.splice(remIdx, 1);
        }
      } else {
        if (isQuizIncorrectOnly) {
          if (currentQuizQuestion.target) {
            remainingVocabPool.push(currentQuizQuestion.target);
          }
        } else {
          quizIncorrectCount++;
          const targetWord = currentQuizQuestion.target.japanese;
          if (!incorrectWordsList.some(item => (item.japanese || item.word) === targetWord)) {
            incorrectWordsList.push({
              japanese: currentQuizQuestion.target.japanese,
              reading: currentQuizQuestion.target.reading || '',
              meaning: currentQuizQuestion.target.meaning || '',
              type: currentQuizQuestion.target.type || ''
            });
            saveIncorrectToStorage();
          }
        }
        feedback.innerText = 'Incorrect';
        feedback.className = 'text-sm font-semibold text-center px-4 py-2 rounded w-full sm:w-96 border border-red-600 bg-white text-red-500 block';
      }
      updateQuizHeaderStats();
      renderQuizOptions();
      setTimeout(() => {
        newQuizQuestion();
      }, 1000);
    }
    function downloadWrongFile() {
      if (incorrectWordsList.length === 0) return;
      const content = incorrectWordsList.map(item => (item.japanese || item.word) + ' ' + (item.reading ? '[' + item.reading + '] ' : '') + '\n意味: ' + item.meaning).join('\n---\n');
      const blob = new Blob([content], { type: 'text/plain;charset=utf-8' });
      const link = document.createElement('a');
      link.href = URL.createObjectURL(blob);
      link.download = 'ok';
      link.click();
    }
    function openIncorrectModal() {
      const modal = document.getElementById('incorrectModal');
      const container = document.getElementById('incorrectListContainer');
      if (incorrectWordsList.length === 0) {
        container.innerHTML = '<p class="text-sm font-semibold text-green-950/60 text-center py-4">No Incorrect Words Yet</p>';
      } else {
        container.innerHTML = incorrectWordsList.map(item => {
          const wordText = item.japanese || item.word || '';
          const readText = item.reading || '';
          return '<div class="bg-green-950/5 border border-green-950/10 p-3 rounded space-y-1">' +
            '<div class="flex items-center justify-between"><span class="font-semibold text-xl text-green-950">' + wordText + '</span>' + (readText ? '<span class="text-base font-semibold text-green-900">' + readText + '</span>' : '') + '</div>' +
            '<div class="text-xs text-green-950/80">意味: ' + item.meaning + '</div>' +
            '</div>';
        }).join('');
      }
      modal.classList.remove('hidden');
      lucide.createIcons();
    }
    function closeIncorrectModal() {
      document.getElementById('incorrectModal').classList.add('hidden');
    }
  </script>
